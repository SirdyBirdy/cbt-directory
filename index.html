<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CBT Technique Finder</title>
<meta name="theme-color" content="#1f3a34">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2421;--mute:#68716d;--line:#e2ded4;--acc:#1f5e50;--acc-ink:#fff;--chip:#ebe8df;--star:#d89a1b}
@media (prefers-color-scheme:dark){:root{--bg:#141917;--card:#1e2522;--ink:#e8ece9;--mute:#98a39e;--line:#2d3632;--acc:#5bbfa6;--acc-ink:#0d1512;--chip:#29322e;--star:#f0b43a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}
#q{flex:1;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
#q:focus{outline:2px solid var(--acc);outline-offset:0}
.tabs{display:flex;gap:6px}
.tab{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 12px;border-radius:12px;cursor:pointer;white-space:nowrap}
.tab[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font:inherit;font-size:14px;flex:none;border:0;background:var(--chip);color:var(--ink);padding:9px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);color:var(--acc-ink)}
.lbl{font-size:12px;color:var(--mute);margin:6px 0 0;text-transform:uppercase;letter-spacing:.04em}
main{max-width:860px;margin:0 auto;padding:10px 14px 60px}
.count{color:var(--mute);font-size:14px;margin:4px 2px 10px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:18px 2px 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 8px}
.head{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;cursor:pointer;width:100%;border:0;background:none;color:inherit;font:inherit;text-align:left}
.t{flex:1;min-width:0}
.t b{display:block;font-weight:600}
.meta{color:var(--mute);font-size:13px;margin-top:2px}
.pg{flex:none;background:var(--chip);border-radius:8px;padding:4px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.star{flex:none;border:0;background:none;font-size:24px;line-height:1;color:var(--mute);cursor:pointer;padding:6px}
.star[aria-pressed=true]{color:var(--star)}
.body{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.card.open .body{display:block}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.tag{font-size:12px;background:var(--chip);border-radius:999px;padding:4px 9px;border:0;color:var(--ink);cursor:pointer;font-family:inherit}
.forms{margin:10px 0 0;padding:0;list-style:none}
.forms li{padding:7px 0;border-top:1px dashed var(--line);display:flex;gap:8px;font-size:14px}
.forms li:first-child{border-top:0}
.forms span:first-child{flex:none;font-weight:600;min-width:52px}
.forms span:last-child{margin-left:auto;color:var(--mute);flex:none}
textarea{width:100%;margin-top:10px;min-height:70px;font:inherit;font-size:15px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
footer{color:var(--mute);font-size:12.5px;padding:10px 16px 40px;max-width:860px;margin:0 auto}
footer button{font:inherit;font-size:12.5px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;margin-right:6px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="row">
    <input id="q" type="search" placeholder="Search technique, form, or problem" autocomplete="off" enterkeyhint="search" aria-label="Search">
    <div class="tabs"><button class="tab" id="tabAll" aria-pressed="true">All</button><button class="tab" id="tabStar" aria-pressed="false">★ <span id="nStar">0</span></button></div>
  </div>
  <div class="chips" id="chChap" aria-label="Chapters"></div>
  <div class="chips" id="chProb" aria-label="Problem area"></div>
  <div class="chips" id="chType" aria-label="Type of exercise"></div>
</header>
<main>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>
<footer>
  <div style="margin-bottom:8px"><button id="exp">Export notes</button><button id="clr">Clear filters</button></div>
  Page numbers are the book's printed pages. PDF page = book page + <span id="off"></span>. Chapter, problem and type labels are my own groupings for quick lookup. Notes stay in this browser only; keep client details out of them.
</footer>
<script src="data.js"></script>
<script>
(function(){
var D=window.DATA, items=D.items, forms=D.forms;
var st={q:'',ch:null,prob:null,type:null,star:false};
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
var stars=store.get('cbt_stars',{}), notes=store.get('cbt_notes',{}), open={};
var $=function(id){return document.getElementById(id)};
$('off').textContent=D.offset;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uniq(a){return a.filter(function(x,i){return a.indexOf(x)===i})}
// build chips
function chips(el,list,key,label,fmt){
  el.innerHTML=list.map(function(x){return '<button class="chip" data-k="'+key+'" data-v="'+esc(x[0])+'" aria-pressed="false">'+esc(x[1])+'</button>'}).join('');
}
var chapKeys=Object.keys(D.chapters).map(Number);
chips($('chChap'),chapKeys.map(function(n){return [n,(n<=11?n+' · ':'')+D.chapters[n]]}),'ch');
var probs=uniq([].concat.apply([],items.map(function(i){return i.problems})));
chips($('chProb'),probs.map(function(p){return [p,p]}),'prob');
var types=uniq([].concat.apply([],items.map(function(i){return i.types})));
chips($('chType'),types.map(function(p){return [p,p]}),'type');
document.addEventListener('click',function(e){
  var c=e.target.closest('.chip'); if(c){var k=c.dataset.k,v=c.dataset.v; if(k==='ch')v=Number(v); st[k]=(st[k]===v)?null:v; sync(); render(); return}
  var s=e.target.closest('.star'); if(s){var id=s.dataset.id; if(stars[id])delete stars[id]; else stars[id]=1; store.set('cbt_stars',stars); render(true); return}
  var tg=e.target.closest('.tag'); if(tg){st[tg.dataset.k]=tg.dataset.v; sync(); render(); window.scrollTo(0,0); return}
  var h=e.target.closest('.head'); if(h){var id2=h.dataset.id; open[id2]=!open[id2]; h.closest('.card').classList.toggle('open',!!open[id2]); h.setAttribute('aria-expanded',!!open[id2])}
});
function sync(){
  document.querySelectorAll('.chip').forEach(function(c){var k=c.dataset.k,v=c.dataset.v; if(k==='ch')v=Number(v); c.setAttribute('aria-pressed',st[k]===v)});
  $('tabAll').setAttribute('aria-pressed',!st.star); $('tabStar').setAttribute('aria-pressed',st.star);
}
$('tabAll').onclick=function(){st.star=false;sync();render()};
$('tabStar').onclick=function(){st.star=true;sync();render()};
$('clr').onclick=function(){st={q:'',ch:null,prob:null,type:null,star:false};$('q').value='';sync();render();window.scrollTo(0,0)};
var tm;$('q').addEventListener('input',function(){clearTimeout(tm);var v=this.value;tm=setTimeout(function(){st.q=v.trim().toLowerCase();render()},80)});
$('exp').onclick=function(){
  var out=items.filter(function(i){return notes[i.id]}).map(function(i){return i.title+' (p.'+i.page+')\n'+notes[i.id]}).join('\n\n')||'No notes yet.';
  var b=new Blob([out],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cbt-notes.txt';a.click();
};
function hay(i){
  return (i.title+' '+D.chapters[i.ch]+' '+i.problems.join(' ')+' '+i.types.join(' ')+' '+i.kind+' '+i.forms.map(function(f){return f+' '+forms[f].title}).join(' ')).toLowerCase().replace(/[‑–—]/g,'-');
}
items.forEach(function(i){i._h=hay(i)});
function match(i){
  if(st.star&&!stars[i.id])return false;
  if(st.ch!==null&&i.ch!==st.ch)return false;
  if(st.prob&&i.problems.indexOf(st.prob)<0)return false;
  if(st.type&&i.types.indexOf(st.type)<0)return false;
  if(st.q){var w=st.q.replace(/[‑–—]/g,'-').split(/\s+/);for(var j=0;j<w.length;j++){if(i._h.indexOf(w[j])<0)return false}}
  return true;
}
function card(i){
  var fm=i.forms.map(function(f){return '<li><span>Form '+f+'</span><span>'+esc(forms[f].title)+'</span><span>p. '+forms[f].page+'</span></li>'}).join('');
  var tags=i.problems.map(function(p){return '<button class="tag" data-k="prob" data-v="'+esc(p)+'">'+esc(p)+'</button>'}).concat(i.types.map(function(p){return '<button class="tag" data-k="type" data-v="'+esc(p)+'">'+esc(p)+'</button>'})).join('');
  var sub=(i.kind==='technique'?'Ch '+i.ch+' · ':i.kind==='distortion'?'Distortion · ':'Ch '+i.ch+' · ')+D.chapters[i.ch]+(i.forms.length?' · '+i.forms.length+' form'+(i.forms.length>1?'s':''):'');
  return '<div class="card'+(open[i.id]?' open':'')+'"><div style="display:flex;align-items:center"><button class="head" data-id="'+i.id+'" aria-expanded="'+!!open[i.id]+'"><div class="t"><b>'+esc(i.title)+'</b><div class="meta">'+esc(sub)+'</div></div><span class="pg">p. '+i.page+'</span></button><button class="star" data-id="'+i.id+'" aria-pressed="'+!!stars[i.id]+'" aria-label="Star">'+(stars[i.id]?'★':'☆')+'</button></div><div class="body">'+(fm?'<ul class="forms">'+fm+'</ul>':'')+'<div class="tags">'+tags+'</div><textarea data-id="'+i.id+'" placeholder="Your own notes (no client info)">'+esc(notes[i.id]||'')+'</textarea></div></div>';
}
document.addEventListener('input',function(e){if(e.target.tagName==='TEXTAREA'){var id=e.target.dataset.id;if(e.target.value.trim())notes[id]=e.target.value;else delete notes[id];store.set('cbt_notes',notes)}});
function render(keep){
  var y=window.scrollY;
  var res=items.filter(match);
  $('nStar').textContent=Object.keys(stars).length;
  $('count').textContent=res.length+(res.length===1?' result':' results');
  if(!res.length){$('list').innerHTML='<div class="empty">Nothing found. Try fewer words or clear filters.</div>';return}
  var html='',last=null;
  res.forEach(function(i){
    var g=i.kind==='technique'?'Chapter '+i.ch+' · '+D.chapters[i.ch]:i.kind==='distortion'?'Chapter 12 · Cognitive distortions (alphabetical by book order)':'Specific applications';
    if(g!==last){html+='<h2>'+esc(g)+'</h2>';last=g}
    html+=card(i);
  });
  $('list').innerHTML=html;
  if(keep)window.scrollTo(0,y);
}
sync();render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body>
</html>
